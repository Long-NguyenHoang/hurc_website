version: '3.8'

services:
  # 1. KHỞI TẠO DATABASE (Không cần Dockerfile)
  postgres:
    image: postgres:18-alpine
    container_name: metro_db
    restart: always # Tự động chạy lại nếu Server bị khởi động lại
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    # Tối ưu RAM cho Database (chia cho Postgres 2GB cache)
    command: postgres -c shared_buffers=2GB -c effective_cache_size=4GB -c work_mem=16MB
    ports:
      # BẢO MẬT TUYỆT ĐỐI: Chỉ cho phép truy cập Database từ bên trong Server này (127.0.0.1)
      - "127.0.0.1:5432:5432"
    volumes:
      # RẤT QUAN TRỌNG: Lưu dữ liệu Database ra ổ cứng thật của Server
      # Nếu không có dòng này, tắt Docker là mất sạch bài viết, nhà ga!
      - pgdata:/var/lib/postgresql/data

  # 2. KHỞI TẠO BACKEND API
  api:
    build: . # Đọc file Dockerfile ở cùng thư mục
    container_name: metro_backend
    restart: always
    ports:
      - "3000:3000" # Mở port 3000 ra Internet (để Frontend gọi vào)
    environment:
      - NODE_ENV=production
      - DB_HOST=postgres # Trỏ thẳng tên kết nối vào dịch vụ postgres phía trên
      - DB_PORT=5432
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_DATABASE=${DB_DATABASE}
      # Nếu có JWT Secret, hãy thêm biến vào đây
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION=${JWT_EXPIRATION}
    depends_on:
      - postgres # Lệnh này bắt buộc Backend phải ĐỢI Database khởi động xong mới được chạy
    deploy:
      resources:
        limits:
          cpus: '1.5' # Giới hạn Backend chỉ dùng tối đa 1.5 nhân CPU
          memory: 2G # Giới hạn Backend dùng 2GB RAM để nhường RAM cho Database

# Khai báo khu vực lưu trữ vĩnh viễn cho Database
volumes:
  pgdata:
